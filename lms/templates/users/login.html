{% extends "partials/base.html" %}

{% block title %}
Log In
{% endblock title %}

{% block content %}
<h1>Log In</h1>

<form action="{% url 'users:login' %}" method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log In</button>
    <p>Don't have an account? <a href="{% url 'users:sign_up' %}">Sign Up</a></p>
</form>

{% endblock content %}
