{% extends "partials/base.html" %}

{% block title %}
Sign Up
{% endblock title %}

{% block content %}
<h1>Sign Up</h1>

<form action="{% url 'users:sign_up' %}" method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
    <p>Already have an account? <a href="{% url 'users:login' %}">Log In</a></p>

</form>

{% endblock content %}
