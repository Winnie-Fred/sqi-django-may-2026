{% extends "partials/base.html" %}

{% block title %}
Create a Book
{% endblock title %}


{% block content %}
<h1>Create a Book</h1>

<div>
   <form method="POST" class="bookCreationForm" action="{% url 'library:create_book_simple_form' %}" enctype="multipart/form-data">
        {% csrf_token %}
        {% comment %} Cross Site Request Forgery {% endcomment %}
        {{ form.as_div }}
        <button type="submit">Create</button>
   </form>
</div>

{% endblock content %}
